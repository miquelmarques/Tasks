<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió de Tasques | Afegeix Tasques</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="background-blob"></div>
    <div class="container">
        <header>
            <h1>🛠️ Afegeix Nova Tasca</h1>
            <p class="subtitle">Gestiona la llista de tasques del curs</p>
        </header>

        <div class="auth-card">
            <div class="input-group">
                <label>Detalls de la Tasca</label>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="new-task-name" placeholder="Ex: Tasca 5: Entrega final" style="flex: 1;">
                        <button id="add-task-btn">Afegir</button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label style="font-size: 0.85rem; min-width: 80px;">Data límit:</label>
                        <input type="datetime-local" id="new-task-date" style="flex: 1;">
                    </div>
                </div>
            </div>

            <div class="input-group" style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
                <label>Importació Massiva (CSV)</label>
                <div style="display: flex; gap: 10px; align-items: center; margin-top: 10px;">
                    <input type="file" id="csv-file" accept=".csv" style="flex: 1; font-size: 0.8rem;">
                    <button id="upload-csv-btn" style="background-color: var(--secondary);">Pujar CSV</button>
                </div>
                <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 8px;">
                    Format del CSV: <code>nom,data</code> (ex: Tasca 1,2026-10-25T12:00)
                </p>
            </div>
        </div>

        <div id="admin-tasks-container" class="tasks-grid">
            <!-- Les tasques es llisten aquí amb botó d'eliminar -->
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">⬅️ Tornar a la Web</a>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
