<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendari de Tasques | ASIX2A</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>
<body>
    <div class="background-blob"></div>
    <div class="container">
        <header>
            <h1>📅 Calendari de Tasques</h1>
            <p class="subtitle">Organitza el teu curs per dies</p>
        </header>

        <div id="auth-section" class="auth-card" style="display:none;">
            <p style="text-align:center;">Inicia sessió per veure el calendari.</p>
            <a href="index.html" style="display:block;text-align:center;color:var(--primary);font-weight:600;margin-top:10px;">Anar a l'inici</a>
        </div>

        <div id="main-section" style="display:none;">
            <div class="user-bar">
                <span id="user-email"></span>
                <div class="nav-links">
                    <a href="index.html" class="nav-link">📋 Llista</a>
                    <a href="stats.html" class="nav-link">📊 Estadístiques</a>
                    <button id="logout-btn" class="btn-logout">Sortir</button>
                </div>
            </div>

            <div id="calendar" style="margin-top:20px;background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-md);border:1px solid var(--border);"></div>
        </div>

        <!-- Task Modal -->
        <div id="task-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <h2 id="modal-title">Personalitzar tasca</h2>
                <input type="hidden" id="task-id">
                <div class="input-group">
                    <label>Nom de la tasca</label>
                    <input type="text" id="task-name">
                </div>
                <div class="input-group">
                    <label>Data de venciment</label>
                    <input type="date" id="task-date">
                </div>
                <div class="input-group">
                    <label>Enllaç (URL)</label>
                    <input type="url" id="task-link" placeholder="https://...">
                </div>
                <div class="input-group">
                    <label>Color</label>
                    <div class="color-selector" id="color-selector">
                        <div class="color-option" data-color="#3b82f6" style="background:#3b82f6;"></div>
                        <div class="color-option" data-color="#22c55e" style="background:#22c55e;"></div>
                        <div class="color-option" data-color="#eab308" style="background:#eab308;"></div>
                        <div class="color-option" data-color="#ef4444" style="background:#ef4444;"></div>
                        <div class="color-option" data-color="#a855f7" style="background:#a855f7;"></div>
                        <div class="color-option" data-color="#64748b" style="background:#64748b;"></div>
                        <div class="color-option" data-color="" style="background:#fff;border-color:#ddd;"></div>
                    </div>
                    <input type="hidden" id="task-color">
                </div>
                <div class="modal-buttons">
                    <button id="save-task-btn">Guardar</button>
                    <button id="delete-calendar-task-btn" class="btn-logout" style="display:none;">🗑️ Eliminar</button>
                    <button id="close-modal-btn" class="btn-secondary">Cancel·lar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="calendar.js"></script>
</body>
</html>
