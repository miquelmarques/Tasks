<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Tasques | Supabase</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="background-blob"></div>
    <div class="container">
        <header>
            <h1>🎓 Seguiment del Curs</h1>
            <p class="subtitle">Inicia sessió per gestionar el teu progrés</p>
        </header>
        
        <div id="auth-section" class="auth-card">
            <div class="input-group">
                <label>Correu electrònic</label>
                <input type="email" id="email" placeholder="exemple@correu.com">
            </div>
            <div class="input-group">
                <label>Contrasenya</label>
                <input type="password" id="password" placeholder="********">
            </div>
            <div class="auth-buttons">
                <button id="login-btn">🚀 Iniciar Sessió</button>
                <button id="signup-btn" class="btn-secondary">Crear Compte</button>
            </div>
        </div>

        <div id="main-section" style="display: none;">
            <div class="user-bar">
                <span id="user-email"></span>
                <div style="display: flex; gap: 10px;">
                    <button id="add-personal-task-btn" class="btn-personal" style="background-color: var(--accent); padding: 8px 15px; font-size: 0.8rem; box-shadow: none;">➕ Tasca Personal</button>
                    <button id="logout-btn" class="btn-logout">Sortir</button>
                </div>
            </div>
            <div id="tasks-container" class="tasks-grid"></div>
        </div>

        <!-- Modal per a Tasques Personals -->
        <div id="personal-task-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>Nou Tasca Personal</h2>
                <div class="input-group">
                    <label>Nom de la tasca</label>
                    <input type="text" id="personal-task-name" placeholder="Ex: Estudiar JavaScript">
                </div>
                <div class="input-group">
                    <label>Data de venciment</label>
                    <input type="datetime-local" id="personal-task-date">
                </div>
                <div class="modal-buttons">
                    <button id="save-personal-task-btn">Guardar</button>
                    <button id="close-modal-btn" class="btn-secondary">Cancel·lar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
