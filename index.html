<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Tasques | Supabase</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="background-blob"></div>
    <div class="container">
        <header>
            <h1>🎓 Seguiment del Curs</h1>
            <p class="subtitle">Inicia sessió per gestionar el teu progrés</p>
        </header>
        
        <!-- Secció d'Autenticació -->
        <div id="auth-section" class="auth-card">
            <div class="input-group">
                <label>Correu electrònic</label>
                <input type="email" id="email" placeholder="exemple@correu.com">
            </div>
            <div class="input-group">
                <label>Contrasenya</label>
                <input type="password" id="password" placeholder="********">
            </div>
            <div class="auth-buttons">
                <button id="login-btn">🚀 Iniciar Sessió</button>
                <button id="signup-btn" class="btn-secondary">Crear Compte</button>
            </div>
        </div>

        <!-- Secció de Tasques (oculta per defecte) -->
        <div id="main-section" style="display: none;">
            <div class="user-bar">
                <span id="user-email"></span>
                <button id="logout-btn" class="btn-logout">Sortir</button>
            </div>
            <div id="tasks-container" class="tasks-grid">
                <!-- Les tasques es generaran aquí -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
