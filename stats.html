<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadístiques de Tasques | ASIX2A</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="background-blob"></div>
    <div class="container">
        <header>
            <h1>📊 Índex Estadístic</h1>
            <p class="subtitle">Mètriques de seguiment i completació de tasques</p>
        </header>

        <div id="auth-section" class="auth-card" style="display:none;">
            <p style="text-align:center;">Inicia sessió per veure les estadístiques.</p>
            <a href="index.html" style="display:block;text-align:center;color:var(--primary);font-weight:600;margin-top:10px;">Anar a l'inici</a>
        </div>

        <div id="main-section" style="display:none;">
            <div class="user-bar">
                <span id="user-email"></span>
                <div class="nav-links">
                    <a href="index.html" class="nav-link">📋 Llista</a>
                    <a href="calendar.html" class="nav-link">📅 Calendari</a>
                    <button id="logout-btn" class="btn-logout">Sortir</button>
                </div>
            </div>

            <!-- Summary KPI Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">Total Tasques</div>
                </div>
                <div class="stat-card accent">
                    <div class="stat-value" id="stat-completed">0</div>
                    <div class="stat-label">Completades</div>
                </div>
                <div class="stat-card warning">
                    <div class="stat-value" id="stat-pending">0</div>
                    <div class="stat-label">Pendents</div>
                </div>
                <div class="stat-card danger">
                    <div class="stat-value" id="stat-overdue">0</div>
                    <div class="stat-label">Vencudes</div>
                </div>
            </div>

            <!-- Overall Progress Bar -->
            <div class="chart-container">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <h3 style="margin:0;">Progrés Global</h3>
                    <span id="progress-percent" style="font-weight:800;font-size:1.2rem;color:var(--primary);">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div id="main-progress-bar" class="progress-bar green" style="width:0%;">0%</div>
                </div>
            </div>

            <!-- Charts Row -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <!-- Doughnut by Completion -->
                <div class="chart-container">
                    <h3>Estat de Completació</h3>
                    <div style="max-height:220px;position:relative;">
                        <canvas id="chart-status"></canvas>
                    </div>
                </div>

                <!-- Bar by Type -->
                <div class="chart-container">
                    <h3>Tasques per Tipus</h3>
                    <div style="max-height:220px;position:relative;">
                        <canvas id="chart-types"></canvas>
                    </div>
                </div>
            </div>

            <!-- Breakdown by Task Type -->
            <div class="chart-container" style="margin-top:16px;">
                <h3>Detall per Modalitat</h3>
                <div id="breakdown-list"></div>
            </div>
        </div>
    </div>
    <script src="stats.js"></script>
</body>
</html>
